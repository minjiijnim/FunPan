# =============================================================================
# FunPan — conda environment for the analysis pipeline & notebooks
# =============================================================================
# Create / activate:
#   conda env create -f environment.yml
#   conda activate funpan
#
# Covers: the per-species pipeline tools that run inside this env, plus the
# Python stack used by the NB0-NB5 analysis notebooks.
#
# NOTE: a few heavy tools run in their OWN dedicated environments / installs
# and are NOT part of this file:
#   - antiSMASH      (env: antismash8)
#   - Gubbins        (env: gubbins)
#   - InterProScan   (standalone install, interproscan.sh on PATH)
#   - SignalP 6      (licensed standalone install)
#   - BiG-SCAPE      (standalone install / its own env)
# =============================================================================
name: funpan

channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # ---- Core ----
  - python=3.11

  # ---- Analysis / notebook Python stack ----
  - pandas=3.0.2
  - numpy=2.4.3
  - scipy=1.17.1
  - matplotlib=3.10.8
  - seaborn
  - statsmodels=0.14.6
  - scikit-learn=1.8.0
  - biopython=1.79
  - requests=2.33.1
  - openpyxl=3.1.5
  - tqdm=4.67.3
  - ete3=3.1.3

  # ---- Jupyter (notebook execution via run_analysis_notebooks.sh) ----
  - jupyter
  - nbconvert
  - ipykernel=7.2.0

  # ---- Genome download & QC ----
  - ncbi-datasets-cli=18.5.1
  - busco=6.0.0
  - fastani=1.34
  - mash=2.3

  # ---- Annotation & comparative genomics ----
  - funannotate=1.8.17
  - eggnog-mapper=2.1.13
  - orthofinder=3.1.0
  - dbcan=5.2.1

  # ---- Alignment / phylogenetics ----
  - parsnp=2.1.5
  - harvesttools=1.3
  - iqtree=2.4.0
  - mafft=7.526
  - muscle=3.8.1551
  - fasttree=2.2.0
  - fastme=2.1.6.3
  - famsa=2.4.1

  # ---- Sequence search ----
  - blast=2.16.0
  - diamond=2.1.24

  # ---- pip-only ----
  - pip
  - pip:
      - adjusttext==1.3.0
